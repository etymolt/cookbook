- title: "Watch a name over time (continuous monitoring)"
  path: examples/watch-loop/README.md
  date: 2026-06-09
  authors: [etymolt]
  tags: [monitoring, recurring, schedule]
  description: |
    Run a verify call on a schedule, diff the verdicts, emit a webhook on
    any axis-level change. The pattern that powers brand-watch services.

- title: "Interpret confidence and temporal validity"
  path: notebooks/interpret-confidence.ipynb
  date: 2026-06-09
  authors: [etymolt]
  tags: [calibration, confidence, temporal, methodology]
  description: |
    A Jupyter notebook that walks through how to read an EVP/1 verdict's
    confidence interval, axis_freshness, and verdict_volatility — and how
    to set thresholds for "act on this" vs "re-verify" vs "ignore".
