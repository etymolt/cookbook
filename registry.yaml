- title: "Verify in Next.js with the official SDK"
  path: examples/nextjs-app-router/README.md
  date: 2026-06-09
  authors: [etymolt]
  tags: [nextjs, sdk, app-router, server-component]
  description: |
    Server-action pattern for calling Etymolt from a Next.js App Router app.
